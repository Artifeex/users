spring:
  application:
    name: users-service

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  datasource:
    url: jdbc:postgresql://localhost:5432/users
    username: users
    password: users
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        ApplicationName: users-service

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 100
          order_updates: true # Что делает?
  liquibase:
    change-log: classpath:db/changelog/users-changelog-master.yml
    enabled: true
server:
  port: 8080
  tomcat:
    mbeanregistry:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus # Открываем только эти эндпоинты для доступа извне
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name} # Тег для метрик, чтобы группировать метрики по сервису. И в целом тэги плолезны для различных фильтраций и разграничений
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,250ms,500ms,1s,2s,5s
  tracing:
    enabled: true
    sampling:
      probability: 1.0 # 1 трейс на каждый HTTP-запрос (кроме случаев, когда span не создаётся)
    opentelemetry:
      export:
        # По умолчанию 5s — spans буферизуются и Grafana «не видит» свежие трейсы сразу после Refresh
        schedule-delay: 1s
        timeout: 10s
  observations:
    annotations:
      enabled: true # @Observed на service-классах
    enable:
      # Имена из Spring Security ObservationDocumentation (мн. число filterchains!)
      spring.security.filterchains: false
      spring.security.secured.requests: false
      spring.security.authorizations: false
      spring.security.authentications: false
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces # локально: Alloy на хосте (docker compose port 4318)

app:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
  import:
    max-errors: 50

# Swagger UI: http://localhost:8080/us/swagger-ui.html
# OpenAPI JSON: http://localhost:8080/us/v3/api-docs
springdoc:
  api-docs:
    path: /us/v3/api-docs
  swagger-ui:
    path: /us/swagger-ui.html
    url: /us/v3/api-docs
tokens:
  jwt:
    access:
      expiration: 60m
    claim:
      roles: roles # field name in jwt token
    private-key: "classpath:certs/private.pem"
    public-key: "classpath:certs/public.pem"
    kid: "users-serivce-key-2026-04"

  refresh:
    expiration: 30d
    tokensForOneUser: 5
  resetPassword:
    length: 15
    expiration: 15m
router:
  file-topic-name: file-topic
  user-topic-name: user-topic
api:
  file-service-base-url: "http://localhost:8087"

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
    ru.sandr: INFO
    io.micrometer.tracing: DEBUG
    io.opentelemetry.exporter.internal.http: DEBUG